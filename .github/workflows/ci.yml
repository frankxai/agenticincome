name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/release.yml'
      - '.github/scripts/release-*'
      - '.github/scripts/validate-release-ledger.mjs'
      - '.github/workflows/draft-release.yml'
      - '.github/workflows/release-contract.yml'
      - 'CHANGELOG.md'
      - 'RELEASING.md'
      - 'docs/releases/**'
      - 'docs/RELEASE-FOUNDATION-*.md'
  pull_request:
    paths-ignore:
      - '.github/release.yml'
      - '.github/scripts/release-*'
      - '.github/scripts/validate-release-ledger.mjs'
      - '.github/workflows/draft-release.yml'
      - '.github/workflows/release-contract.yml'
      - 'CHANGELOG.md'
      - 'RELEASING.md'
      - 'docs/releases/**'
      - 'docs/RELEASE-FOUNDATION-*.md'

concurrency:
  group: agenticincome-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER == 'railway' && fromJSON('["self-hosted","linux","x64","railway"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Merge gate
        run: pnpm run merge:gate

      - name: Build
        run: pnpm build
