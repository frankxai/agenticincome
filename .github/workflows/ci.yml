name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/release.yml'
      - '.github/scripts/release-*'
      - '.github/scripts/validate-release-ledger.mjs'
      - '.github/workflows/draft-release.yml'
      - '.github/workflows/release-contract.yml'
      - 'CHANGELOG.md'
      - 'RELEASING.md'
      - 'docs/releases/**'
      - 'docs/RELEASE-FOUNDATION-*.md'
  pull_request:
    # ready_for_review: drafts skip the build below, so marking a PR ready must build it without another push.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '.github/release.yml'
      - '.github/scripts/release-*'
      - '.github/scripts/validate-release-ledger.mjs'
      - '.github/workflows/draft-release.yml'
      - '.github/workflows/release-contract.yml'
      - 'CHANGELOG.md'
      - 'RELEASING.md'
      - 'docs/releases/**'
      - 'docs/RELEASE-FOUNDATION-*.md'

concurrency:
  # PR runs share one group per PR, so a newer push supersedes the running build. Every
  # other run gets its own group: a shared group would let a newer push replace a queued one.
  group: agenticincome-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Drafts do not build. A skipped job reports success, so merge automation must not treat a skipped `build` as green.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Dormant Railway switch: only this private repository (not a fork, the org mirror or a fork PR) opts in, and only
    # when the repository variable CI_RUNNER is 'railway'. Otherwise the hosted runner is used, as before.
    runs-on: ${{ vars.CI_RUNNER == 'railway' && github.repository_id == '1262748116' && github.event.repository.private == true && github.event.repository.fork == false && (github.event_name == 'push' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.id == github.event.repository.id) && fromJSON('["self-hosted","linux","x64","railway"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Merge gate
        run: pnpm run merge:gate

      - name: Build
        run: pnpm build
