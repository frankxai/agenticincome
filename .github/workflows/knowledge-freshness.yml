name: knowledge-freshness

on:
  schedule:
    - cron: '0 9 1 * *' # monthly, 1st, 09:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ${{ vars.CI_RUNNER == 'railway' && fromJSON('["self-hosted","linux","x64","railway"]') || 'ubuntu-slim' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Flag knowledge files past their review cycle
        run: |
          set -euo pipefail
          STALE_DAYS=100
          now=$(date +%s)
          stale=0
          {
            echo "## Knowledge freshness audit — $(date -u +%F)"
            echo ""
            echo "| file | last_verified | age (days) | status |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in knowledge/*.md; do
            lv=$(grep -m1 '^last_verified:' "$f" | awk '{print $2}' || true)
            if [ -z "$lv" ]; then
              echo "| $f | — | — | ⚠️ missing last_verified |" >> "$GITHUB_STEP_SUMMARY"
              stale=$((stale+1))
              continue
            fi
            then=$(date -d "$lv" +%s)
            age=$(( (now - then) / 86400 ))
            if [ "$age" -gt "$STALE_DAYS" ]; then
              echo "| $f | $lv | $age | 🔴 stale — re-verify |" >> "$GITHUB_STEP_SUMMARY"
              stale=$((stale+1))
            else
              echo "| $f | $lv | $age | 🟢 fresh |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$stale" -gt 0 ]; then
            echo "**$stale file(s) need a re-verification pass — run the knowledge-refresh loop.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All knowledge files within review cycle." >> "$GITHUB_STEP_SUMMARY"

  program-terms:
    # Public network reads run on an isolated hosted runner with no merchant credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Review the catalog's recorded terms sources
        run: node scripts/review-program-terms.mjs "$RUNNER_TEMP/terms-review" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the reviewer queue and dated observations
        uses: actions/upload-artifact@v4
        with:
          name: program-terms-review
          path: ${{ runner.temp }}/terms-review/
          retention-days: 35
          if-no-files-found: error
