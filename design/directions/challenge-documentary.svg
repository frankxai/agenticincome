<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Direction 3: documentary experiment board</title><desc id="desc">One proposed offer, five evidence windows and eight unrun model entries form a source-backed experiment record.</desc>
  <rect width="1200" height="800" fill="#05060A"/><g font-family="sans-serif"><text x="80" y="95" font-size="18" fill="#10B981">03 / Documentary experiment board · Selected</text><text x="80" y="175" font-size="48" fill="#F1F3F9">Build something worth buying.</text><text x="80" y="235" font-size="48" fill="#10B981">Make the evidence visible.</text><text x="80" y="295" font-size="20" fill="#8A90A8">AI Workflow Edition · Proposed EUR 149 · Outcome unmeasured</text></g>
  <rect x="80" y="340" width="1040" height="100" rx="12" fill="#0A0C14" stroke="#1A1F2E"/><g font-family="sans-serif"><text x="110" y="382" font-size="18" fill="#F59E0B">Planned · Start not recorded</text><text x="110" y="416" font-size="22" fill="#F1F3F9">One complete sample. One precise offer. A verified delivery path.</text></g>
  <g stroke="#1A1F2E"><path d="M80 480H1120M80 558H1120M80 636H1120"/></g><g font-family="sans-serif" font-size="22" fill="#F1F3F9"><text x="90" y="530">1h / 12h / 48h / 72h / Monthly</text><text x="90" y="608">Eight model families · Equal conditions · Unscored</text></g>
  <g font-family="sans-serif" font-size="20" fill="#10B981"><text x="80" y="700">Download shared brief</text><text x="490" y="700">Continue into the seven-day guide</text></g>
  <text x="80" y="755" font-family="sans-serif" font-size="18" fill="#8A90A8">Selected for continuity, inspectable outcomes and honest evidence states.</text>
