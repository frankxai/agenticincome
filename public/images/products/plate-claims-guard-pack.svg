  <text x="28" y="102" fill="#8A90A8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Audits regulated claims, dated citations, voice restraint, AI-slop, and disclosures</text>

  <!-- Schematic Body -->
  
      <rect x="28" y="134" width="172" height="142" rx="10" fill="#0A0C14" stroke="#1A1F2E"/>
      <text x="44" y="158" fill="#8A90A8" font-family="ui-monospace, monospace" font-size="10">INPUT DRAFT</text>
