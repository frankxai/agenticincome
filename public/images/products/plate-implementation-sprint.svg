  <text x="36" y="28" fill="#F1F3F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">AGENT-AS-A-SERVICE · SCOPED SPRINT</text>
  <rect x="524" y="13" width="96" height="22" rx="11" fill="#101522" stroke="#1A1F2E"/>
