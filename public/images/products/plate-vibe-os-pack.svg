  <text x="28" y="102" fill="#8A90A8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">3 Claude skills, 4 Python audio utilities, and worked session scripts</text>

  <!-- Schematic Body -->
  
      <rect x="28" y="134" width="584" height="142" rx="10" fill="#0A0C14" stroke="#1A1F2E"/>
      <rect x="46" y="154" width="126" height="102" rx="8" fill="#101522" stroke="#1A1F2E"/>
