  </defs>
  <rect width="640" height="360" rx="16" fill="url(#surfaceGrad)"/>
  <rect x="0.5" y="0.5" width="639" height="359" rx="15.5" stroke="#1A1F2E"/>
  <rect x="16" y="52" width="608" height="256" fill="url(#grid)" opacity="0.7"/>

