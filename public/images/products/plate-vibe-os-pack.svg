<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none" role="img" aria-label="State-to-Prompt Sonic Studio Pipeline">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
